apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

android {
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    namespace 'com.zebra.zds'

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.zebra'
            artifactId = 'zds'
            // x-release-please-start-version
            version = '1.1.0'
            // x-release-please-end

            afterEvaluate {
                from components.release
            }
            pom {
                name = 'zds-android'
                description = 'Zebra Design System Android'
            }
        }
    }

    // Publishing properties are only required when a publish task actually runs, so that
    // assemble/lint/test can configure without Artifactory credentials.
    def publishProperties = ['zds-android-maven', 'publish', 'mavenUsername', 'mavenPassword']
            .collectEntries { [(it): project.findProperty(it)?.toString()] }
    def missingPublishProperties = publishProperties.findAll { !it.value }.keySet()

    repositories {
        maven {
            credentials {
                username = publishProperties['mavenUsername'] ?: ''
                password = publishProperties['mavenPassword'] ?: ''
            }
            url = missingPublishProperties.isEmpty()
                    ? publishProperties['zds-android-maven'] + publishProperties['publish']
                    : 'https://invalid.invalid/missing-publish-properties'
        }
    }

    tasks.withType(PublishToMavenRepository).configureEach {
        doFirst {
            if (!missingPublishProperties.isEmpty()) {
                throw new GradleException(
                        "Cannot publish: missing Gradle properties ${missingPublishProperties.join(', ')}")
            }
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}
